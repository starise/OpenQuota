name: Refresh bundled pricing

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: 'Europe/Rome'
  workflow_dispatch:
    inputs:
      publish:
        description: Commit verified snapshots to the default branch
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-bundled-pricing
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Refresh pricing snapshots
        run: node scripts/update_pricing_snapshots.mjs

      - name: Check for snapshot changes
        id: snapshots
        run: |
          changed=$(git diff --name-only -- \
            src-tauri/resources/pricing_litellm_snapshot.json \
            src-tauri/resources/pricing_models_dev_snapshot.json)
          if [[ -n "$changed" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo "No pricing changes."
          fi

      - name: Install Tauri build dependencies
        if: steps.snapshots.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        if: steps.snapshots.outputs.changed == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.snapshots.outputs.changed == 'true'
        with:
          workspaces: src-tauri -> target

      - name: Test candidate pricing snapshots
        if: steps.snapshots.outputs.changed == 'true'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib pricing

      - name: Commit changed snapshots
        if: >-
          steps.snapshots.outputs.changed == 'true' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          (github.event_name == 'schedule' || inputs.publish)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            src-tauri/resources/pricing_litellm_snapshot.json \
            src-tauri/resources/pricing_models_dev_snapshot.json
          git commit -m "chore(pricing): refresh bundled snapshots"
          git push
