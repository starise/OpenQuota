name: macOS signed release probe
on:
  push:
    branches:
      - codex/macos-release-probe
permissions:
  contents: read
env:
  RELEASE_TAG: v0.5.0
jobs:
  build-macos:
    name: Build and smoke macOS Universal
    runs-on: macos-26-intel
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.macos-package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build macOS release packages
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: >
          set -euo pipefail

          key="$RUNNER_TEMP/openquota-probe.key"

          pnpm tauri signer generate --ci --password "" --write-keys "$key"
          >/dev/null

          node --input-type=commonjs -e 'const fs = require("node:fs"); const p
          = "src-tauri/tauri.conf.json"; const cfg =
          JSON.parse(fs.readFileSync(p)); cfg.plugins.updater.pubkey =
          fs.readFileSync(process.argv[1], "utf8").trim(); fs.writeFileSync(p,
          JSON.stringify(cfg));' "$key.pub"

          export TAURI_SIGNING_PRIVATE_KEY="$key"

          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""

          pnpm tauri build --target universal-apple-darwin --bundles app,dmg
          --config src-tauri/tauri.release.conf.json
      - name: Smoke test the macOS release package
        uses: ./.github/actions/platform-smoke
        with:
          artifact-root: src-tauri/target/universal-apple-darwin/release/bundle
      - name: Stage macOS release files
        shell: bash
        run: >
          set -euo pipefail

          shopt -s nullglob

          bundle=src-tauri/target/universal-apple-darwin/release/bundle

          archives=("$bundle"/macos/*.app.tar.gz)

          dmgs=("$bundle"/dmg/*.dmg)

          if [[ ${#archives[@]} != 1 || ${#dmgs[@]} != 1 || ! -s
          "${archives[0]}.sig" ]]; then
            echo '::error::Expected one universal app archive, its signature, and one DMG.'
            exit 1
          fi

          mkdir -p macos-release

          base="macos-release/OpenQuota_${RELEASE_TAG#v}_universal"

          cp "${archives[0]}" "$base.app.tar.gz"

          cp "${archives[0]}.sig" "$base.app.tar.gz.sig"

          cp "${dmgs[0]}" "$base.dmg"

          cp "$RUNNER_TEMP/openquota-probe.key.pub"
          macos-release/probe-public.key
      - name: Upload verified macOS packages
        id: macos-package
        uses: actions/upload-artifact@v7
        with:
          name: OpenQuota-macos-release-${{ github.run_attempt }}
          path: macos-release/
          if-no-files-found: error
  verify-package:
    name: Verify the signed macOS updater archive
    needs:
      - build-macos
    runs-on: ubuntu-22.04
    steps:
      - name: Download the smoke-tested macOS packages
        id: macos-artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact_id }}
          path: release-check/macos
      - name: Verify disposable test key and archive signature
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/minisign.tar.gz \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/minisign.tar.gz --directory /tmp \
            minisign-linux/x86_64/minisign
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign \
            /usr/local/bin/minisign
          archive="release-check/macos/OpenQuota_0.5.0_universal.app.tar.gz"
          test -s "release-check/macos/OpenQuota_0.5.0_universal.dmg"
          base64 --decode "release-check/macos/probe-public.key" > release-check/probe.pub
          base64 --decode "$archive.sig" > "$archive.minisig"
          minisign -Vm "$archive" -p release-check/probe.pub -x "$archive.minisig"
