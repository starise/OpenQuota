name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    outputs:
      release_commit: ${{ steps.trusted_tag.outputs.release_commit }}
      windows_signing: ${{ steps.signing_policy.outputs.windows_signing }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate trusted release tag
        id: trusted_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" \
            '+refs/heads/main:refs/remotes/origin/main'
          git show-ref --verify --quiet "refs/tags/${RELEASE_TAG}"
          tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main || {
            echo "Release tag is not on origin/main: $RELEASE_TAG" >&2
            exit 1
          }
          git checkout --detach "$tag_commit"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          echo "release_commit=$tag_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve release signing policy
        id: signing_policy
        env:
          ENABLE_WINDOWS_NATIVE_SIGNING: ${{ vars.ENABLE_WINDOWS_NATIVE_SIGNING || 'false' }}
        run: |
          case "$ENABLE_WINDOWS_NATIVE_SIGNING" in
            true | false) echo "windows_signing=$ENABLE_WINDOWS_NATIVE_SIGNING" >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::ENABLE_WINDOWS_NATIVE_SIGNING must be either true or false.'; exit 1 ;;
          esac

      - name: Validate release signing credentials
        env:
          WINDOWS_SIGNING_ENABLED: ${{ steps.signing_policy.outputs.windows_signing }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ES_USERNAME: ${{ steps.signing_policy.outputs.windows_signing == 'true' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ steps.signing_policy.outputs.windows_signing == 'true' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ steps.signing_policy.outputs.windows_signing == 'true' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ steps.signing_policy.outputs.windows_signing == 'true' && secrets.ES_TOTP_SECRET || '' }}
          WINDOWS_SIGNER_SUBJECT: ${{ steps.signing_policy.outputs.windows_signing == 'true' && vars.WINDOWS_SIGNER_SUBJECT || '' }}
        run: |
          required=(TAURI_SIGNING_PRIVATE_KEY)
          if [[ "$WINDOWS_SIGNING_ENABLED" = true ]]; then
            required+=(ES_USERNAME ES_PASSWORD ES_CREDENTIAL_ID ES_TOTP_SECRET WINDOWS_SIGNER_SUBJECT)
          else
            echo '::warning::Windows artifacts will not be Authenticode-signed.'
          fi
          for name in "${required[@]}"; do
            test -n "${!name:-}" || {
              echo "Missing required release signing value: $name" >&2
              exit 1
            }
          done

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Validate release tag
        run: node scripts/verify/verify-versions.js "$RELEASE_TAG"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm verify

  prepare-release:
    name: Prepare draft release
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_commit }}

      - name: Verify immutable release tag
        run: >-
          bash .github/scripts/verify-release-tag.sh
          "$RELEASE_TAG"
          "${{ needs.validate.outputs.release_commit }}"

      - name: Create or reuse draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')"
            test "$is_draft" = true || {
              echo "Release $RELEASE_TAG already exists and is not a draft." >&2
              exit 1
            }
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --title "OpenQuota ${RELEASE_TAG#v}" \
              --generate-notes \
              --notes $'OpenQuota desktop release for Windows and Linux on x64/ARM64. macOS availability is listed with the downloads.\n\nAutomatic updates are cryptographically signed. Linux in-app updates are supported by AppImage builds; Debian packages update through the package installer.'
          fi

          release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish-artifacts:
    name: Build and smoke ${{ matrix.name }}
    needs: [validate, prepare-release]
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles nsis --config src-tauri/tauri.release.conf.json
            windows-signing-args: --config src-tauri/tauri.windows-signing.conf.json
            rust-targets: ''
            smoke-artifact-root: src-tauri/target/release/bundle
          - name: Windows ARM64
            platform: windows-11-arm
            args: --target aarch64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json
            windows-signing-args: --config src-tauri/tauri.windows-signing.conf.json
            rust-targets: aarch64-pc-windows-msvc
            smoke-artifact-root: src-tauri/target/aarch64-pc-windows-msvc/release/bundle
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles deb,appimage --config src-tauri/tauri.release.conf.json
            windows-signing-args: ''
            rust-targets: ''
            smoke-artifact-root: src-tauri/target/release/bundle
          - name: Linux ARM64
            platform: ubuntu-22.04-arm
            args: --target aarch64-unknown-linux-gnu --bundles deb,appimage --config src-tauri/tauri.release.conf.json
            windows-signing-args: ''
            rust-targets: aarch64-unknown-linux-gnu
            smoke-artifact-root: src-tauri/target/aarch64-unknown-linux-gnu/release/bundle

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_commit }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dbus-tests \
            dbus-x11 \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            openbox \
            librsvg2-dev \
            xdg-utils \
            patchelf \
            weston \
            xdotool \
            xvfb

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Linux AppImage bundler
        if: runner.os == 'Linux'
        run: bash .github/scripts/setup-linuxdeploy.sh

      - name: Prepare Windows code signing
        if: runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true'
        shell: pwsh
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: .github/scripts/setup-windows-signing.ps1

      - name: Build and upload platform artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ES_USERNAME: ${{ runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true' && secrets.ES_USERNAME || '' }}
          ES_PASSWORD: ${{ runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true' && secrets.ES_PASSWORD || '' }}
          ES_CREDENTIAL_ID: ${{ runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true' && secrets.ES_CREDENTIAL_ID || '' }}
          ES_TOTP_SECRET: ${{ runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true' && secrets.ES_TOTP_SECRET || '' }}
          OPENQUOTA_EXPECTED_WINDOWS_SIGNER_SUBJECT: ${{ runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true' && vars.WINDOWS_SIGNER_SUBJECT || '' }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          releaseDraft: true
          uploadUpdaterJson: false
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true
          retryAttempts: 2
          args: >-
            ${{ matrix.args }}
            ${{ runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true' && matrix.windows-signing-args || '' }}

      - name: Check out release smoke tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: .github/actions/platform-smoke

      - name: Smoke test release artifact
        uses: ./.release-workflow/.github/actions/platform-smoke
        with:
          artifact-root: ${{ matrix.smoke-artifact-root }}
          release-validation: ${{ (runner.os == 'Linux' || (runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true')) && 'true' || 'false' }}
          windows-signer-subject: ${{ runner.os == 'Windows' && needs.validate.outputs.windows_signing == 'true' && vars.WINDOWS_SIGNER_SUBJECT || '' }}

  build-macos:
    name: Build and smoke macOS Universal
    needs: validate
    runs-on: macos-26-intel
    timeout-minutes: 60
    outputs:
      artifact_id: ${{ steps.macos-package.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_commit }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve native macOS signing
        id: signing
        env:
          ENABLE_MACOS_NATIVE_SIGNING: ${{ vars.ENABLE_MACOS_NATIVE_SIGNING || 'false' }}
        run: |
          case "$ENABLE_MACOS_NATIVE_SIGNING" in
            true | false) echo "native=$ENABLE_MACOS_NATIVE_SIGNING" >> "$GITHUB_OUTPUT" ;;
            *) echo '::error::ENABLE_MACOS_NATIVE_SIGNING must be either true or false.'; exit 1 ;;
          esac

      - name: Configure ad-hoc macOS signing
        if: steps.signing.outputs.native != 'true'
        shell: bash
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Configure native macOS signing
        if: steps.signing.outputs.native == 'true'
        shell: bash
        env:
          OPENQUOTA_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          OPENQUOTA_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          OPENQUOTA_APPLE_ID: ${{ secrets.APPLE_ID }}
          OPENQUOTA_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          OPENQUOTA_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          write_env() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Missing required macOS signing value: $name"
              return 1
            fi
            local delimiter="OPENQUOTA_$(uuidgen)"
            {
              printf '%s<<%s\n' "$name" "$delimiter"
              printf '%s\n' "$value"
              printf '%s\n' "$delimiter"
            } >> "$GITHUB_ENV"
          }

          write_env APPLE_CERTIFICATE "$OPENQUOTA_APPLE_CERTIFICATE"
          write_env APPLE_CERTIFICATE_PASSWORD "$OPENQUOTA_APPLE_CERTIFICATE_PASSWORD"
          write_env APPLE_ID "$OPENQUOTA_APPLE_ID"
          write_env APPLE_PASSWORD "$OPENQUOTA_APPLE_PASSWORD"
          write_env APPLE_TEAM_ID "$OPENQUOTA_APPLE_TEAM_ID"

      - name: Build macOS release packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: >-
          pnpm tauri build --target universal-apple-darwin
          --bundles app,dmg --config src-tauri/tauri.release.conf.json

      - name: Check out release smoke tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-workflow
          sparse-checkout: .github/actions/platform-smoke

      - name: Smoke test the macOS release package
        uses: ./.release-workflow/.github/actions/platform-smoke
        with:
          artifact-root: src-tauri/target/universal-apple-darwin/release/bundle
          release-validation: ${{ steps.signing.outputs.native }}
          apple-team-id: ${{ steps.signing.outputs.native == 'true' && secrets.APPLE_TEAM_ID || '' }}

      - name: Stage macOS release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          archives=("$bundle"/macos/*.app.tar.gz)
          dmgs=("$bundle"/dmg/*.dmg)
          if [[ ${#archives[@]} != 1 || ${#dmgs[@]} != 1 || ! -s "${archives[0]}.sig" ]]; then
            echo '::error::Expected one universal app archive, its signature, and one DMG.'
            exit 1
          fi
          mkdir -p macos-release
          base="macos-release/OpenQuota_${RELEASE_TAG#v}_universal"
          cp "${archives[0]}" "$base.app.tar.gz"
          cp "${archives[0]}.sig" "$base.app.tar.gz.sig"
          cp "${dmgs[0]}" "$base.dmg"

      - name: Upload verified macOS packages
        id: macos-package
        uses: actions/upload-artifact@v7
        with:
          name: OpenQuota-macos-release-${{ github.run_attempt }}
          path: macos-release/
          if-no-files-found: error

  publish-release:
    name: Verify and publish release
    needs: [validate, prepare-release, publish-artifacts, build-macos]
    if: >-
      !cancelled() &&
      needs.validate.result == 'success' &&
      needs.prepare-release.result == 'success' &&
      needs.publish-artifacts.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.release_commit }}

      - name: Read draft release state
        id: release-state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          mkdir -p release-check
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > release-check/release.json
          draft="$(jq -r '.draft' release-check/release.json)"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Download Windows and Linux release packages
        if: steps.release-state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -r '.assets[]
            | select(
                .name | test("(-setup\\.exe|\\.AppImage|\\.deb)(\\.sig)?$")
              )
            | [.id, .name]
            | @tsv' release-check/release.json |
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              -H 'Accept: application/octet-stream' \
              > "release-check/$asset_name"
          done

      - name: Download the smoke-tested macOS packages
        id: macos-artifact
        if: >-
          steps.release-state.outputs.draft == 'true' &&
          needs.build-macos.result == 'success' &&
          needs.build-macos.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build-macos.outputs.artifact_id }}
          path: release-check/macos

      - name: Verify updater signatures with the bundled public key
        id: signatures
        if: steps.release-state.outputs.draft == 'true'
        env:
          MACOS_DOWNLOADED: ${{ steps.macos-artifact.outcome == 'success' }}
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/minisign.tar.gz \
            https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  /tmp/minisign.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file /tmp/minisign.tar.gz --directory /tmp \
            minisign-linux/x86_64/minisign
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign \
            /usr/local/bin/minisign
          node <<'NODE'
          const fs = require('node:fs');
          const config = require('./src-tauri/tauri.conf.json');
          const encoded = config.plugins?.updater?.pubkey;
          if (!encoded) throw new Error('Missing updater public key');
          fs.writeFileSync('release-check/updater-public.key', Buffer.from(encoded, 'base64'));
          NODE
          verify_signature() {
            local signature="$1"
            test -f "${signature%.sig}" &&
              base64 --decode "$signature" > "$signature.minisig" &&
              minisign -Vm "${signature%.sig}" \
              -p release-check/updater-public.key \
              -x "$signature.minisig"
          }
          for signature in release-check/*.sig; do
            verify_signature "$signature"
          done

          macos_base="release-check/macos/OpenQuota_${RELEASE_TAG#v}_universal"
          if [[ "$MACOS_DOWNLOADED" == true && -s "$macos_base.dmg" ]] &&
            verify_signature "$macos_base.app.tar.gz.sig"; then
            echo 'macos=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::This release has no verified macOS package.'
          fi

      - name: Prepare updater manifests
        if: steps.release-state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          INCLUDE_MACOS: ${{ steps.signatures.outputs.macos == 'true' }}
        run: |
          set -euo pipefail
          manifest_args=(
            release-check/release.json release-check "$GITHUB_REPOSITORY"
            "$RELEASE_TAG" "${RELEASE_TAG#v}" release-check/latest.json
          )
          macos_manifest=release-check/latest-macos.json
          if [[ "$INCLUDE_MACOS" == true ]]; then
            macos_base="release-check/macos/OpenQuota_${RELEASE_TAG#v}_universal"
            gh release upload "$RELEASE_TAG" --clobber \
              "$macos_base.dmg" "$macos_base.app.tar.gz" "$macos_base.app.tar.gz.sig"
            cp "$macos_base.app.tar.gz.sig" release-check/
            gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-check/release.json
            node .github/scripts/create-updater-json.mjs "${manifest_args[@]}" with-macos "$macos_manifest"
          else
            node .github/scripts/create-updater-json.mjs "${manifest_args[@]}" without-macos
            previous_manifest="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest-macos.json"
            status="$(curl --silent --show-error --location --retry 3 --max-time 30 \
              --output "$macos_manifest" --write-out '%{http_code}' "$previous_manifest")"
            case "$status" in
              200) jq -e '.version and (.platforms | has("darwin-aarch64") and has("darwin-x86_64"))' "$macos_manifest" >/dev/null ;;
              404) rm -f "$macos_manifest" ;; # No macOS release has been published yet.
              *) echo "::error::Previous macOS manifest returned HTTP $status."; exit 1 ;;
            esac
          fi

      - name: Publish verified release
        if: steps.release-state.outputs.draft == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          bash .github/scripts/verify-release-tag.sh \
            "$RELEASE_TAG" \
            "${{ needs.validate.outputs.release_commit }}"
          manifests=(release-check/latest.json)
          if [[ -f release-check/latest-macos.json ]]; then
            manifests+=(release-check/latest-macos.json)
          fi
          gh release upload "$RELEASE_TAG" "${manifests[@]}" --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true

      - name: Verify public release downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            > release-check/release.json
          jq -e '.draft == false and any(.assets[]; .name == "latest.json")' \
            release-check/release.json >/dev/null
          urls="$(jq -r '.assets[].browser_download_url' release-check/release.json | sort -u)"
          while IFS= read -r url; do
            downloaded=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --location --silent --show-error \
                --range 0-0 --output /dev/null "$url"; then
                downloaded=true
                break
              fi
              echo "Public download is not ready yet (attempt $attempt/5): $url"
              sleep 3
            done
            test "$downloaded" = true
          done <<< "$urls"
